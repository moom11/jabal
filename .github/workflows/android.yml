# بناء تطبيق أندرويد تلقائياً عند كل تحديث لمجلد android أو يدوياً من تبويب Actions
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a test (debug-signed) APK"
          fi

      - name: Build APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/jabal.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/jabal.aab

      - uses: actions/upload-artifact@v4
        with:
          name: jabal-android
          path: out/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: تطبيق الجبل للأندرويد 1.0.${{ github.run_number }}
          body: ثبّت ملف jabal.apk على الجوال. ملف jabal.aab للرفع على Google Play.
          files: |
            out/jabal.apk
            out/jabal.aab
